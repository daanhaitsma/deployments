name: Deploy static site

on:
  workflow_call:
    inputs:
      host:
        type: string
        required: true
      path:
        description: 'Project directory on the server. Point the web server document root at <path>/current.'
        type: string
        required: true
      known-hosts:
        type: string
        required: true
      user:
        type: string
        required: true
      port:
        type: number
        default: 22
      node-version:
        type: string
        default: '24'
      keep-releases:
        type: number
        default: 3
      build-path:
        description: 'Directory containing the built site. Only its contents are uploaded.'
        type: string
        default: 'build'
      exclude-paths:
        description: 'rsync exclude patterns, relative to build-path.'
        type: string
        default: ''
      install-commands:
        description: 'Dependency installation before caching. CACHE_HIT is true when dependencies were restored. Use an empty string to skip.'
        type: string
        default: 'if [[ "$CACHE_HIT" != true ]]; then npm ci; fi'
      test-commands:
        description: 'Commands before the build. Use an empty string to skip.'
        type: string
        default: ''
      build-commands:
        type: string
        default: 'npm run build'
      before-activation:
        type: string
        default: ''
      after-activation:
        type: string
        default: ''
    secrets:
      ssh-key:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.host }}-${{ inputs.path }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ inputs.host }}
      DEPLOY_USER: ${{ inputs.user }}
      PROJECT_PATH: ${{ inputs.path }}
      DEPLOY_PORT: ${{ inputs.port }}
      BUILD_PATH: ${{ inputs.build-path }}
      BEFORE_ACTIVATION: ${{ inputs.before-activation }}
      AFTER_ACTIVATION: ${{ inputs.after-activation }}
      EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
      KEEP_RELEASES: ${{ inputs.keep-releases }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Runtime cache key
        id: runtime
        env:
          INSTALL_COMMANDS: ${{ inputs.install-commands }}
        run: |
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "install=$(printf '%s' "$INSTALL_COMMANDS" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        id: dependencies
        with:
          path: node_modules
          key: static-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ steps.runtime.outputs.install }}-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Install dependencies
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          INSTALL_COMMANDS: ${{ inputs.install-commands }}
        run: |
          bash -euv -o pipefail <<< "$INSTALL_COMMANDS"

      - uses: actions/cache/save@v5
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: node_modules
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Test and build
        env:
          TEST_COMMANDS: ${{ inputs.test-commands }}
          BUILD_COMMANDS: ${{ inputs.build-commands }}
        run: |
          set -euo pipefail
          bash -euv -o pipefail <<< "$TEST_COMMANDS"
          bash -euv -o pipefail <<< "$BUILD_COMMANDS"
          if [[ ! -d "$BUILD_PATH" ]]; then
            echo "::error::Build path '$BUILD_PATH' does not exist after building"
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ssh-key }}

      - name: Register server host key
        env:
          KNOWN_HOSTS: ${{ inputs.known-hosts }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          [[ "$KEEP_RELEASES" =~ ^[1-9][0-9]*$ ]]
          socket="${RUNNER_TEMP:-/tmp}/deploy-ssh-$$"
          ssh_options=(-p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o "ControlPath=$socket" -o ControlPersist=60)
          connect() { ssh "${ssh_options[@]}" "$remote" "$@"; }
          printf -v RSYNC_RSH 'ssh'; for option in "${ssh_options[@]}"; do printf -v RSYNC_RSH '%s %q' "$RSYNC_RSH" "$option"; done
          export RSYNC_RSH
          release=$(date -u +%Y%m%d%H%M%S)
          release_path="$PROJECT_PATH/releases/$release"
          created=false

          cleanup() {
            status=$?
            if [[ $status -ne 0 && $created == true ]]; then
              connect "if [ \"\$(readlink -f '$PROJECT_PATH/current')\" != '$release_path' ]; then rm -rf -- '$release_path'; fi" || true
            fi
            ssh "${ssh_options[@]}" -O exit "$remote" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          ssh "${ssh_options[@]}" -MNf "$remote"
          connect "mkdir -p '$PROJECT_PATH/releases' && mkdir '$release_path'"
          created=true
          connect "if [ -d '$PROJECT_PATH/.release-template' ]; then cp -a '$PROJECT_PATH/.release-template/.' '$release_path/'; fi"
          exclude_args=()
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] || exclude_args+=("--exclude=$pattern")
          done <<< "$EXCLUDE_PATHS"
          rsync -rltz --no-perms --chmod=ugo=rwX "${exclude_args[@]}" \
            "${BUILD_PATH%/}/" "$remote:$release_path/"

          before=$(printf '%s\n' "$BEFORE_ACTIVATION" | base64 -w0)
          after=$(printf '%s\n' "$AFTER_ACTIVATION" | base64 -w0)
          connect bash -s -- "$PROJECT_PATH" "$release" "$KEEP_RELEASES" "$before" "$after" <<'REMOTE'
          set -euo pipefail
          project=$1
          release="$project/releases/$2"
          keep=$3
          before=$(printf '%s\n' "$4" | base64 -d)
          after=$(printf '%s\n' "$5" | base64 -d)
          exec 9>"$project/.deploy.lock"
          flock -w 300 9
          cd "$release"

          shopt -s dotglob nullglob
          for source in "$project/shared/"*; do
            target="$release/${source##*/}"
            rm -rf -- "$target"
            ln -s "$source" "$target"
          done
          echo "Running before-activation in $release"
          bash -euv -o pipefail <<< "$before"
          ln -s "$release" "$project/.current-$2"
          mv -Tf "$project/.current-$2" "$project/current"
          echo "Running after-activation in $release"
          bash -euv -o pipefail <<< "$after"

          # Keep the active release plus the configured number of previous releases.
          # Plain pipe instead of process substitution: some shared hosts have no /dev/fd.
          active=$(readlink -f "$project/current")
          find "$project/releases" -mindepth 1 -maxdepth 1 -type d \
            ! -path "$active" -printf '%T@ %f\n' | sort -nr | cut -d ' ' -f 2- |
            tail -n +"$keep" |
            while IFS= read -r name; do
              if [ -n "$name" ]; then rm -rf -- "$project/releases/$name"; fi
            done
          REMOTE

name: Deploy Laravel

on:
  workflow_call:
    inputs:
      host:
        type: string
        required: true
      path:
        type: string
        required: true
      known-hosts:
        type: string
        required: true
      user:
        type: string
        required: true
      port:
        type: number
        default: 22
      php-version:
        type: string
        default: '8.5'
      node-version:
        type: string
        default: '24'
      keep-releases:
        type: number
        default: 3
      test-commands:
        type: string
        required: true
      before-activation:
        type: string
        default: ''
      after-activation:
        type: string
        default: ''
    secrets:
      ssh-key:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.host }}-${{ inputs.path }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ inputs.host }}
      DEPLOY_USER: ${{ inputs.user }}
      PROJECT_PATH: ${{ inputs.path }}
      DEPLOY_PORT: ${{ inputs.port }}
      BEFORE_ACTIVATION: ${{ inputs.before-activation }}
      AFTER_ACTIVATION: ${{ inputs.after-activation }}
      KEEP_RELEASES: ${{ inputs.keep-releases }}
      COMPOSER_NO_INTERACTION: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, pdo_sqlite, gd, exif, zip, intl, bcmath
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Runtime cache key
        id: runtime
        run: |
          echo "php=$(php -r 'echo PHP_VERSION;')" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        id: dependencies
        with:
          path: |
            vendor
            node_modules
          key: dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.php }}-${{ steps.runtime.outputs.node }}-${{ hashFiles('composer.lock', 'composer.json', 'package-lock.json', 'package.json') }}

      - name: Install dependencies
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: |
          composer install --prefer-dist --no-progress
          if [[ "$CACHE_HIT" != true ]]; then npm ci; fi

      - uses: actions/cache/save@v5
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            vendor
            node_modules
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Test and build
        env:
          TEST_COMMANDS: ${{ inputs.test-commands }}
          APP_ENV: testing
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          MAIL_MAILER: array
        run: |
          set -euo pipefail
          bash -euv -o pipefail <<< "$TEST_COMMANDS"
          composer install --no-dev --prefer-dist --no-progress --optimize-autoloader --no-scripts
          rm -f .env bootstrap/cache/*.php

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ssh-key }}

      - name: Register server host key
        env:
          KNOWN_HOSTS: ${{ inputs.known-hosts }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          [[ "$KEEP_RELEASES" =~ ^[1-9][0-9]*$ ]]
          socket="${RUNNER_TEMP:-/tmp}/deploy-ssh-$$"
          ssh_options=(-p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o "ControlPath=$socket" -o ControlPersist=60)
          connect() { ssh "${ssh_options[@]}" "$remote" "$@"; }
          printf -v RSYNC_RSH 'ssh'; for option in "${ssh_options[@]}"; do printf -v RSYNC_RSH '%s %q' "$RSYNC_RSH" "$option"; done
          export RSYNC_RSH
          release=$(date -u +%Y%m%d%H%M%S)
          release_path="$PROJECT_PATH/releases/$release"
          created=false

          cleanup() {
            status=$?
            if [[ $status -ne 0 && $created == true ]]; then
              connect "if [ \"\$(readlink -f '$PROJECT_PATH/current')\" != '$release_path' ]; then rm -rf -- '$release_path'; fi" || true
            fi
            ssh "${ssh_options[@]}" -O exit "$remote" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          ssh "${ssh_options[@]}" -MNf "$remote"
          connect "mkdir '$release_path'"
          created=true
          connect "cp -a '$PROJECT_PATH/.release-template/.' '$release_path/'"
          rsync -rltz --no-perms --chmod=ugo=rwX \
            --exclude='/.git/' --exclude='/.github/' \
            --exclude='/.env*' --exclude='/auth.json' \
            --exclude='/node_modules/' --exclude='/tests/' \
            --exclude='/.phpunit*' --exclude='/storage/' \
            --exclude='/bootstrap/cache/*.php' \
            --exclude='/public/storage' --exclude='/public/hot' \
            ./ "$remote:$release_path/"

          before=$(printf '%s\n' "$BEFORE_ACTIVATION" | base64 -w0)
          after=$(printf '%s\n' "$AFTER_ACTIVATION" | base64 -w0)
          connect bash -s -- "$PROJECT_PATH" "$release" "$KEEP_RELEASES" "$before" "$after" <<'REMOTE'
          set -euo pipefail
          project=$1
          release="$project/releases/$2"
          keep=$3
          before=$(printf '%s\n' "$4" | base64 -d)
          after=$(printf '%s\n' "$5" | base64 -d)
          exec 9>"$project/.deploy.lock"
          flock -w 300 9
          cd "$release"

          shopt -s dotglob nullglob
          for source in "$project/shared/"*; do
            target="$release/${source##*/}"
            rm -rf -- "$target"
            ln -s "$source" "$target"
          done
          echo "Running before-activation in $release"
          bash -euv -o pipefail <<< "$before"
          ln -s "$release" "$project/.current-$2"
          mv -Tf "$project/.current-$2" "$project/current"
          echo "Running after-activation in $release"
          bash -euv -o pipefail <<< "$after"

          # Keep the active release plus the configured number of previous releases.
          active=$(readlink -f "$project/current")
          mapfile -t old < <(
            find "$project/releases" -mindepth 1 -maxdepth 1 -type d \
              ! -path "$active" -printf '%T@ %f\n' | sort -nr | cut -d ' ' -f 2-
          )
          for name in "${old[@]:$((keep - 1))}"; do
            rm -rf -- "$project/releases/$name"
          done
          REMOTE
